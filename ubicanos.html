    link.rel = 'stylesheet';
    link.href = leafletCSS;
    document.head.appendChild(link);

        if (window.L) callback();

      return;

    function getBrandAndLocation(name) {
      let brand = 'ULTRAJEWELS';
      let location = name;

      if (name.includes('ULTRAJEWELS')) {
        location = name.replace('ULTRAJEWELS ', '');
      } else if (name.includes('TAG Heuer')) {
        brand = 'TAG HEUER';
        location = name.replace('TAG Heuer ', '');
      } else if (name.includes('Montblanc')) {
        brand = 'MONTBLANC';
        location = name.replace('Montblanc ', '');
      } else if (name.includes('Cartier')) {
        brand = 'CARTIER';
        location = name.replace('Cartier ', '');
      } else if (name.includes('Hublot')) {
        brand = 'HUBLOT';
        location = name.replace('Hublot ', '');
      } else if (name.includes('Breitling')) {
        brand = 'BREITLING';
        location = name.replace('Breitling ', '');
      }

      return { brand, location };
    }

    function initLeafletMap() {
      const firstStore = stores.find(function (s) {
        return s.lat && s.lng;
      });

      const startCenter = firstStore ? [firstStore.lat, firstStore.lng] : initialMapCenter;
      const startZoom = firstStore ? 15 : 5;

      map = L.map('uj-leaflet-map', {
        center: startCenter,
        zoom: startZoom,
        scrollWheelZoom: true
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      stores.forEach(function (store) {
        if (!store.lat || !store.lng) return;

        const marker = L.marker([store.lat, store.lng], {
          icon: customIcon,
          title: store.name
        }).addTo(map);

        marker.on('click', function () {
          selectStore(store.id);
          openInfo(store.id);
        });

        markerById.set(store.id, marker);
      });

      fitAllStores();
      renderStores();
      setupEventListeners();
      setupResetButton();

      setTimeout(function () {
        map.invalidateSize();
        fitAllStores();
      }, 300);

      setTimeout(function () {
        map.invalidateSize();
      }, 1000);
    }

            href="https://www.google.com/maps/dir/?api=1&destination=${store.lat},${store.lng}"
            target="_blank"
            style="display:inline-block; background:#EF922E; color:white; text-decoration:none; font-size:10px; font-weight:700; padding:6px 12px; border-radius:99px; text-transform:uppercase;"
          >
            Cómo llegar
          </a>
        </div>
      `;

      marker.bindPopup(popupContent, {
        closeButton: true,
        autoPan: true
      }).openPopup();

      currentPopup = marker;
    }

    function fitAllStores() {
      const coords = stores
        .filter(function (s) {
          return s.lat && s.lng;
        })
        .map(function (s) {
          return [s.lat, s.lng];
        });

      if (!coords.length || !map) return;

      const bounds = L.latLngBounds(coords);

      map.fitBounds(bounds, {
        padding: [40, 40]
      });

      setTimeout(function () {
        initialMapCenter = map.getCenter();
        initialMapZoom = map.getZoom();
      }, 300);
    }

    function fitCity(city) {
      const coords = stores
        .filter(function (s) {
          return s.city === city && s.lat && s.lng;
        })
        .map(function (s) {
          return [s.lat, s.lng];
        });

      if (!coords.length || !map) return;

      if (coords.length === 1) {
        map.setView(coords[0], 15);
      } else {
        map.fitBounds(L.latLngBounds(coords), {
          padding: [40, 40]
        });
      }

      setTimeout(function () {
        map.invalidateSize();
      }, 300);
    }

    function selectStore(id, skipScroll) {
      selectedStoreId = id;

      const store = stores.find(function (s) {
        return s.id === id;
      });

      if (!store || !map) return;

      if (store.lat && store.lng) {
        map.setView([store.lat, store.lng], 15, {
          animate: true
        });
      }

      setResetVisibility();

      document.querySelectorAll('.uj-guard .store-card').forEach(function (card) {
        const active = parseInt(card.dataset.storeId) === id;
        card.classList.toggle('active', active);

        if (active && !skipScroll && window.innerWidth > 968) {
          setTimeout(function () {
            card.scrollIntoView({
              behavior: 'smooth',
              block: 'center',
              inline: 'nearest'
            });
          }, 300);
        }
      });
    }

    function renderStores() {
      const filtered = currentCity === 'todos'
        ? stores
        : stores.filter(function (s) {
            return s.city === currentCity;
          });

      if (!filtered.length) {
        storesList.innerHTML = '<div class="no-stores">No hay tiendas disponibles.</div>';
        return;
      }

      storesList.innerHTML = filtered.map(function (store) {
        const data = getBrandAndLocation(store.name);
        const imgs = store.images || [store.image];

        if (sliderIndices[store.id] === undefined) {
          sliderIndices[store.id] = 0;
        }

        const buttons = imgs.length > 1
          ? `
            <button class="slider-btn prev" data-store="${store.id}" data-dir="-1">❮</button>
            <button class="slider-btn next" data-store="${store.id}" data-dir="1">❯</button>
          `
          : '';

        const slidesHTML = imgs.map(function (src) {
          return `<img src="${src}" class="store-image" draggable="false">`;
        }).join('');

        return `
          <div class="store-card ${selectedStoreId === store.id ? 'active' : ''}" data-store-id="${store.id}">
            <div class="slider-wrapper">
              <div class="slider-track" id="track-${store.id}">
                ${slidesHTML}
              </div>
              ${buttons}
            </div>

            <div class="store-info">
              <div class="store-brand">${data.brand}</div>
              <div class="store-location">${data.location}</div>
              <div class="store-address">${store.address}</div>

              <div class="store-actions">
                <a class="btn-detail" href="${store.url}" target="_blank">
                  Ver Boutique
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.uj-guard .store-card').forEach(function (card) {
        card.addEventListener('click', function (e) {
          if (e.target.closest('.slider-btn') || e.target.closest('.btn-detail')) return;

          const id = parseInt(card.dataset.storeId);
          const isMobile = window.innerWidth <= 968;

          selectStore(id, isMobile);
          openInfo(id);

          if (isMobile) {
            setTimeout(function () {
              const mapSection = document.querySelector('.uj-guard .map-section');
              const yOffset = -20;
              const y = mapSection.getBoundingClientRect().top + window.pageYOffset + yOffset;

              window.scrollTo({
                top: y,
                behavior: 'smooth'
              });
            }, 150);
          }
        });
      });

      document.querySelectorAll('.uj-guard .slider-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          e.preventDefault();

          const storeId = parseInt(this.dataset.store);
          const direction = parseInt(this.dataset.dir);

          moveSlide(storeId, direction);
        });
      });
    }

    function moveSlide(storeId, direction) {
      const store = stores.find(function (s) {
        return s.id === storeId;
      });

      if (!store) return;

      const imgs = store.images || [store.image];

      if (!imgs || imgs.length <= 1) return;

      let current = sliderIndices[storeId];
      let next = current + direction;

      if (next < 0) next = imgs.length - 1;
      if (next >= imgs.length) next = 0;

      sliderIndices[storeId] = next;

      const track = document.getElementById('track-' + storeId);

      if (track && track.parentElement) {
        const slideWidth = track.parentElement.offsetWidth;
        track.style.transform = 'translateX(-' + next * slideWidth + 'px)';
      }
    }

    function setupResetButton() {
      resetBtn.addEventListener('click', function () {
        selectedStoreId = null;
        currentCity = 'todos';

        if (currentPopup) {
          currentPopup.closePopup();
        }

        document.querySelectorAll('.uj-guard .store-card').forEach(function (card) {
          card.classList.remove('active');
        });

        document.querySelectorAll('.uj-guard .city-tab').forEach(function (tab) {
          tab.classList.remove('active');
        });

        fitAllStores();
        renderStores();
        setResetVisibility();
      });
    }

    function setupEventListeners() {
      document.querySelectorAll('.uj-guard .city-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          document.querySelectorAll('.uj-guard .city-tab').forEach(function (t) {
            t.classList.remove('active');
          });

          this.classList.add('active');

          currentCity = this.dataset.city;
          selectedStoreId = null;

          if (currentPopup) {
            currentPopup.closePopup();
          }

          renderStores();
          fitCity(currentCity);
          setResetVisibility();
        });
      });
    }

    function setResetVisibility() {
      const shouldShow = selectedStoreId || currentCity !== 'todos';
      resetBtn.style.display = shouldShow ? 'inline-block' : 'none';
    }

    initLeafletMap();
  });
})();
</script>
